<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Neon Glow Ring -->
  <path d="M 256 95 C 160 95 82 173 82 269 C 82 308 95 344 118 373 L 95 440 L 165 419 C 192 434 223 443 256 443 C 352 443 430 365 430 269 C 430 173 352 95 256 95 Z"
        fill="none"
        stroke="url(#bubbleGrad)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Chat Bubble Frame -->
  <path d="M 256 95 C 160 95 82 173 82 269 C 82 308 95 344 118 373 L 95 440 L 165 419 C 192 434 223 443 256 443 C 352 443 430 365 430 269 C 430 173 352 95 256 95 Z"
        fill="rgba(15, 23, 42, 0.65)"
        stroke="url(#bubbleGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- 2KT Brand Typography -->
  <text x="256" y="295"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="115"
        font-weight="900"
        fill="url(#textGrad)"
        text-anchor="middle"
        letter-spacing="2">2KT</text>

  <!-- Status / Real-time Sparkle Dot -->
  <circle cx="360" cy="180" r="16" fill="#10b981" filter="url(#glow)" />
</svg>
